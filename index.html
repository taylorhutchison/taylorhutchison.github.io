<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Taylor Hutchison</title>
	<meta name="description" content="Taylor Hutchison on GitHub and LinkedIn.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--bg-top: #eaf2fb;
			--bg-bottom: #cfdceb;
			--ink: #101722;
			--muted: #4e5b6b;
			--panel: rgba(255, 255, 255, 0.7);
			--panel-border: rgba(16, 23, 34, 0.08);
			--accent: #2563eb;
			--accent-soft: #bfdbfe;
			--shadow: 0 20px 60px rgba(16, 23, 34, 0.16);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: "IBM Plex Sans", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at top left, rgba(255, 255, 255, 0.85), transparent 32%),
				radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.18), transparent 28%),
				linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
			overflow: hidden;
		}

		body::before,
		body::after {
			content: "";
			position: fixed;
			border-radius: 999px;
			filter: blur(8px);
			pointer-events: none;
		}

		body::before {
			width: 320px;
			height: 320px;
			top: -80px;
			right: -70px;
			background: rgba(37, 99, 235, 0.16);
		}

		body::after {
			width: 260px;
			height: 260px;
			bottom: -70px;
			left: -40px;
			background: rgba(15, 23, 42, 0.12);
		}

		main {
			position: relative;
			width: min(860px, 100%);
			padding: 48px;
			border: 1px solid var(--panel-border);
			border-radius: 28px;
			background: var(--panel);
			backdrop-filter: blur(14px);
			box-shadow: var(--shadow);
			animation: rise 700ms ease-out both;
		}

		.hero {
			display: grid;
			grid-template-columns: minmax(0, 1.2fr) minmax(220px, 300px);
			gap: 40px;
			align-items: center;
		}

		.hero-copy {
			min-width: 0;
		}

		.portrait {
			position: relative;
			justify-self: end;
			width: min(100%, 280px);
			aspect-ratio: 1 / 1;
			padding: 10px;
			border-radius: 50%;
			background: linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(191, 219, 254, 0.78));
			box-shadow: 0 18px 36px rgba(16, 23, 34, 0.18);
		}

		.portrait::after {
			content: "";
			position: absolute;
			inset: -6px 6px auto auto;
			width: 72px;
			height: 72px;
			border-radius: 50%;
			background: rgba(37, 99, 235, 0.16);
			z-index: -1;
		}

		.portrait img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center 22%;
			border-radius: 50%;
		}

		.eyebrow {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 24px;
			font-size: 0.85rem;
			font-weight: 500;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: var(--muted);
		}

		.eyebrow::before {
			content: "";
			width: 44px;
			height: 1px;
			background: linear-gradient(90deg, var(--accent), transparent);
		}

		h1 {
			margin: 0;
			font-family: "Space Grotesk", sans-serif;
			font-size: clamp(3rem, 9vw, 5.6rem);
			line-height: 0.95;
			letter-spacing: -0.05em;
			max-width: 6ch;
		}

		p {
			max-width: 34rem;
			margin: 24px 0 0;
			font-size: 1.08rem;
			line-height: 1.7;
			color: var(--muted);
		}

		.links {
			display: flex;
			flex-wrap: wrap;
			gap: 16px;
			margin-top: 36px;
		}

		.links a {
			display: inline-flex;
			align-items: center;
			justify-content: space-between;
			min-width: 180px;
			padding: 16px 20px;
			border: 1px solid rgba(24, 34, 47, 0.12);
			border-radius: 16px;
			text-decoration: none;
			color: var(--ink);
			background: rgba(255, 255, 255, 0.72);
			font-weight: 500;
			transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
		}

		.link-label {
			display: inline-flex;
			align-items: center;
			gap: 12px;
		}

		.link-label svg {
			width: 20px;
			height: 20px;
			fill: currentColor;
			flex: 0 0 auto;
		}

		.links a span:last-child {
			font-size: 1.1rem;
			color: var(--accent);
			transition: transform 180ms ease;
		}

		.links a:hover,
		.links a:focus-visible {
			transform: translateY(-3px);
			border-color: rgba(37, 99, 235, 0.35);
			box-shadow: 0 14px 30px rgba(16, 23, 34, 0.12);
			background: rgba(255, 255, 255, 0.9);
			outline: none;
		}

		.links a:hover span:last-child,
		.links a:focus-visible span:last-child {
			transform: translateX(3px);
		}

		.accent {
			color: var(--accent);
		}

		@keyframes rise {
			from {
				opacity: 0;
				transform: translateY(24px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 640px) {
			body {
				padding: 18px;
			}

			main {
				padding: 32px 24px;
				border-radius: 22px;
			}

			.hero {
				grid-template-columns: 1fr;
				gap: 20px;
			}

			.portrait {
				order: -1;
				justify-self: center;
				width: min(100%, 200px);
				padding: 8px;
			}

			.portrait::after {
				width: 52px;
				height: 52px;
			}

			h1 {
				max-width: none;
			}

			p {
				font-size: 1rem;
			}

			.links a {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main>
		<section class="hero">
			<div class="hero-copy">
				<div class="eyebrow">Nashville-based developer</div>
				<h1>Taylor <span class="accent">Hutchison</span></h1>
				<p>
					I build web applications using primarily .NET and Angular on Azure.
				</p>
				<div class="links" aria-label="Social links">
					<a href="https://github.com/taylorhutchison" target="_blank" rel="noreferrer noopener">
						<span class="link-label">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<path d="M12 .5C5.65.5.5 5.66.5 12.03c0 5.1 3.3 9.43 7.88 10.95.58.1.79-.25.79-.56 0-.27-.01-1.18-.02-2.14-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.78 2.7 1.26 3.36.97.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.29-5.25-5.74 0-1.27.45-2.3 1.19-3.11-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.19 1.19a10.9 10.9 0 0 1 5.8 0c2.21-1.5 3.18-1.19 3.18-1.19.63 1.58.24 2.75.12 3.04.74.81 1.19 1.84 1.19 3.11 0 4.46-2.7 5.45-5.28 5.73.41.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.21 0 .31.21.67.8.56A11.54 11.54 0 0 0 23.5 12.03C23.5 5.66 18.35.5 12 .5Z"/>
							</svg>
							<span>GitHub</span>
						</span>
						<span aria-hidden="true">&#8599;</span>
					</a>
					<a href="https://www.linkedin.com/in/taylorhutch/" target="_blank" rel="noreferrer noopener">
						<span class="link-label">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<path d="M4.98 3.5A2.48 2.48 0 0 0 2.5 5.98c0 1.37 1.1 2.48 2.48 2.48h.03A2.48 2.48 0 0 0 7.5 5.98 2.48 2.48 0 0 0 5.02 3.5h-.04ZM2.9 9.5h4.2v11.1H2.9V9.5Zm6.83 0h4.02v1.52h.06c.56-1.06 1.93-2.18 3.97-2.18 4.25 0 5.03 2.8 5.03 6.44v5.32h-4.2v-4.72c0-1.12-.02-2.57-1.57-2.57-1.57 0-1.81 1.22-1.81 2.49v4.8h-4.2V9.5Z"/>
							</svg>
							<span>LinkedIn</span>
						</span>
						<span aria-hidden="true">&#8599;</span>
					</a>
				</div>
			</div>
			<div class="portrait">
				<img src="images/me.jpg" alt="Portrait of Taylor Hutchison">
			</div>
		</section>
	</main>
</body>
</html>
